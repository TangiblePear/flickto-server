name = "flickto-share-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Bind to flickto.app/api/share* (JSON API) and /share/* (human
# landing page), plus the E2EE social channel (user profiles/opinions/access,
# inbox, friendcode), the portable-identity backup + live friends record, and
# the data-deletion endpoints. Legal pages (/privacy, /delete) are now served
# as static HTML by the flickto-content worker.
routes = [
  { pattern = "flickto.app/api/share", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/share/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/share/*", zone_name = "flickto.app" },
  # Group Watch. ⚠️ THREE patterns, not one. A pattern matches the full URL, and
  # `/api/watch/*` does NOT match the bare `/api/watch` the create call posts to — the
  # exact trap the commentary further down was written for. Verify each with a live curl
  # after deploy: 405 = the worker was never reached, 404 = reached but no handler,
  # 400/426 = reached and handled.
  { pattern = "flickto.app/api/watch", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/watch/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/watch/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/user/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/opinions/batch", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/friendcode", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/friendcode/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/social/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/account/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/auth/*", zone_name = "flickto.app" },
  # Phase 2 server-authoritative profiles. Without these patterns the Worker never
  # sees the requests at all — and `wrangler deploy --dry-run` passes regardless.
  { pattern = "flickto.app/api/me/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/profile/*", zone_name = "flickto.app" },
  # Phase 3/4. Note the bare patterns as WELL as the wildcards: `/api/friends/*`
  # does NOT match `/api/friends`, so the list endpoint would fall through to the
  # static site and answer 404 while every test and the dry-run stayed green.
  { pattern = "flickto.app/api/friends", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/friends/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/blocks", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/blocks/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/report", zone_name = "flickto.app" },
  # Bare pattern: /api/feed is not matched by any wildcard above. The trailing `*`
  # is NOT optional either — routes match the full URL including the query string,
  # so a bare `…/api/feed` answers `/api/feed` but lets `/api/feed?limit=50` — the
  # only form the client actually sends — fall through to the static site as a 404.
  # This is the same trap as `/api/friends` above, from the other direction, and it
  # is invisible to both the test suite and `wrangler deploy --dry-run`.
  { pattern = "flickto.app/api/feed*", zone_name = "flickto.app" },
  # Public list directory (src/publicLists.ts, migration 0039). ONE pattern covers
  # the whole subtree, and the trailing `*` carries three separate jobs — drop it
  # and each fails differently:
  #   • `/api/public/lists`                     — the bare browse call
  #   • `/api/public/lists?sort=trending&tag=…` — the form the client ACTUALLY sends
  #   • `/api/public/lists/{owner}/{id}/follow` — detail, tags, follow, like, report
  # Same trap as /api/feed and /api/sync above, hit from all three directions at once.
  #
  # ⚠️ Measured on production 2026-08-15, AFTER a green deploy of all the handlers:
  # `GET https://flickto.app/api/public/lists` answered 404 with `text/html` — the
  # static site's SPA page. The Worker was never reached, six of the eight endpoints
  # were dead, and nothing upstream noticed: the suite calls the handlers directly
  # rather than through this table, so 1039 tests stayed green, and
  # `wrangler deploy --dry-run` does not check routing at all.
  #
  # The content type is the tell. The Worker's own 404 is `application/json`; an
  # HTML body means the request never got here.
  { pattern = "flickto.app/api/public/lists*", zone_name = "flickto.app" },
  # One chargeable request per refresh (src/sync.ts). Same wildcard trap as
  # /api/feed above — routes match the FULL URL including the query string, so the
  # trailing `*` is not optional even though the client POSTs a body.
  #
  # `wrangler deploy --dry-run` proves nothing about routing. Verify with a live
  # curl; the three answers mean three different things (measured 2026-07-27):
  #   405 -> the Worker was NEVER REACHED. The static site answered, since it
  #          serves GET/HEAD only. This is what a missing/wrong pattern looks like.
  #   404 -> the Worker was reached but its router had no handler for that
  #          method+path (e.g. POST /api/me/bootstrap, which is GET-only).
  #   401 -> route matched, handler ran, session rejected. THIS is the target.
  #   curl.exe -s -o NUL -w "%{http_code}" -X POST https://flickto.app/api/sync \
  #     -H "Content-Type: application/json" -d "{}"
  { pattern = "flickto.app/api/sync*", zone_name = "flickto.app" },
  # Shared lists + Friend Match in D1 (src/lists.ts, src/match.ts). Same trap as
  # above — the trailing `*` covers the query string, and `/api/lists/*` does NOT
  # match a bare `/api/lists`, which is why these are wildcards over the whole
  # subtree rather than a pattern per endpoint.
  #
  # `/api/share/{code}/report` needs NO new pattern: `/api/share/*` is already
  # bound on line 12, and a duplicate pattern is a deploy error.
  { pattern = "flickto.app/api/lists/*", zone_name = "flickto.app" },
  # Bare pattern as WELL as the wildcard: `/api/match/*` does NOT match `/api/match`,
  # so the list endpoint would fall through to the static site and answer 405 while
  # every test and the dry-run stayed green. Same trap as `/api/friends` above.
  { pattern = "flickto.app/api/match", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/match/*", zone_name = "flickto.app" },
  # Comments (src/comments.ts). `/api/titles/*` covers both read paths — the public
  # list and the `/friends` slice — because every comment URL has a `{type}/{id}`
  # segment after `/api/titles`, so there is no bare path to miss here. The
  # trailing `*` still matters for a different reason: routes match the FULL URL
  # including the query string, and every comment read carries `?season=…&lang=…`.
  #
  # `/api/comments` needs BOTH forms. The bare pattern answers the POST; the
  # wildcard answers `DELETE /api/comments/{id}`. `/api/comments/*` does NOT match
  # `/api/comments`, which is the trap that has now bitten five times — and both
  # `wrangler deploy --dry-run` and the whole vitest suite stay green while the
  # route 404s to the static site. src/routing.test.ts is the thing that catches
  # the handler half; only a live curl catches the pattern half.
  { pattern = "flickto.app/api/titles/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/comments", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/comments/*", zone_name = "flickto.app" },
  # commsuni.tv archive routes (src/commsuniComments.ts). The BARE `*` form, which
  # matches `/api/archive`, `/api/archive/comments/{uuid}/replies` and anything with a
  # query string — `*` matches any string INCLUDING `/`.
  #
  # ⚠️ NOT `/api/archive/*`: that does not match a bare `/api/archive`, which is the
  # trap this table already records for /api/friends, /api/match, /api/feed and
  # /api/sync. Neither the vitest suite nor `wrangler deploy --dry-run` can see it —
  # the suite calls handlers directly and the dry-run never contacts the zone. Verify
  # with a live curl; 405 means the Worker was never reached, 401 is the target.
  { pattern = "flickto.app/api/archive*", zone_name = "flickto.app" },
  # Comment moderation, called by the /admin Pages functions with X-Admin-Key.
  # Not user-facing; gated by the ADMIN_KEY secret, which when unset closes these
  # routes rather than opening them.
  #
  # ⚠️ NOT `/api/admin/*` — that pattern is already assigned to flickto-scoring-api,
  # and Cloudflare gives a route to exactly one worker, so the deploy is REJECTED
  # rather than the routes being merged. Found on the first real deploy, 2026-07-28;
  # `wrangler deploy --dry-run` cannot see it because it never contacts the zone.
  { pattern = "flickto.app/api/moderation/*", zone_name = "flickto.app" },
  # In-app feedback (src/feedback.ts). ONE pattern covers all three endpoints because
  # a route `*` matches any string INCLUDING `/`: `/api/feedback` (the app's POST),
  # `/api/feedback/admin` and `/api/feedback/admin/act` (the panel, X-Admin-Key) all
  # match `flickto.app/api/feedback*`.
  #
  # `…/api/feedback*` and NOT `…/api/feedback/*` — the latter does not match the bare
  # path the app actually posts to, which is the trap this file has hit six times
  # already (see /api/friends, /api/match, /api/comments). Both vitest and
  # `wrangler deploy --dry-run` stay green either way; only a live request tells them
  # apart. 405 ⇒ the static site answered and this pattern is wrong; 401 ⇒ correct.
  #
  # ⚠️ This pattern is BELT, not braces — and knowing which is the point. Measured
  # against production 2026-08-06, BEFORE it was deployed: `POST /api/feedback`
  # answered **404**, not 405. 404 means the Worker was reached and its router had no
  # handler — so something was already routing this path, and it is `/api/feed*` four
  # entries up: a route `*` matches any string, and "feedback" starts with "feed".
  #
  # So feedback would work without this line today. Keep it anyway: `/api/feed*` has a
  # trailing `*` only to carry a query string, and narrowing it to `/api/feed` is an
  # obvious future cleanup that would silently kill feedback with every test green.
  # Overlapping patterns are fine — only an EXACTLY duplicated one is a deploy error.
  { pattern = "flickto.app/api/feedback*", zone_name = "flickto.app" },
  # Fleet insights (src/insights.ts), called by the /admin Pages function with
  # X-Admin-Key. Same ADMIN_KEY gate as moderation, and the same reason it is NOT
  # under `/api/admin/*`: that prefix is already flickto-scoring-api's, and a route
  # belongs to exactly one worker, so reusing it rejects the deploy outright.
  { pattern = "flickto.app/api/insights*", zone_name = "flickto.app" },
  # The admin Users panel (src/usersAdmin.ts, src/devicesAdmin.ts). Same ADMIN_KEY gate
  # and the same reason for not being under `/api/admin/*` as insights above.
  #
  # One pattern each: a route `*` matches any string INCLUDING `/`, so `/api/users*` covers
  # the bare list, `/api/users/act` and `/api/users/{id}` together.
  #
  # ⚠️ `/api/users*` does NOT overlap the existing public `flickto.app/api/user/*`
  # (singular) — different subtree, and not an exact duplicate, so the deploy is clean.
  # Only an EXACTLY duplicated pattern is a deploy error; overlapping ones are fine.
  { pattern = "flickto.app/api/users*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/devices*", zone_name = "flickto.app" },
  # GIF picker (src/giphy.ts). Trailing `*` is load-bearing as always — routes
  # match the full URL including the query string, and every call carries `?q=`
  # or `?limit=`.
  { pattern = "flickto.app/api/giphy/*", zone_name = "flickto.app" },
  # Watch history (src/history.ts). ONE pattern covers the whole subtree because a
  # route `*` matches any string INCLUDING `/`: `/api/history` (the bare list),
  # `/api/history?cursor=…&limit=50` (the only form the client actually sends),
  # `/api/history/sync`, `/api/history/stats` and `DELETE /api/history/{id}` all
  # match `flickto.app/api/history*`.
  #
  # That is exactly why it is `…/api/history*` and not `…/api/history/*` — the
  # latter does NOT match a bare `/api/history`, which is the trap that has now
  # bitten six times in this file (see /api/friends, /api/match, /api/comments
  # above). The whole vitest suite and `wrangler deploy --dry-run` stay green
  # either way; only a live curl tells them apart. 405 means this pattern is
  # wrong and the static site answered; 401 means the Worker ran.
  { pattern = "flickto.app/api/history*", zone_name = "flickto.app" },
  # Platform-wide watch stats. PUBLIC and unauthenticated by design — it is one
  # aggregate number for everybody, so it is edge-cacheable and identifies nobody.
  # Its own pattern rather than a bare `/api/stats*`: that prefix is deliberately
  # left free, and a narrow pattern cannot accidentally swallow a future
  # per-user `/api/stats/...` route and serve it to the internet.
  { pattern = "flickto.app/api/stats/global*", zone_name = "flickto.app" },
  # One Take. Every endpoint carries a path segment after the prefix, so `/*` covers them
  # all -- and it must, because `/api/daily-game/*` does NOT match a bare
  # `/api/daily-game`. `*` also spans the query string, which `?date=` and `?window=`
  # rely on.
  { pattern = "flickto.app/api/daily-game/*", zone_name = "flickto.app" },
  # Sticker cut-outs (src/stickers.ts).
  #
  # `/api/me/*` on line 24 ALREADY covers both write endpoints — `/api/me/stickers` and
  # `/api/me/stickers/{id}` — because a route `*` matches any string including `/`. No
  # pattern is added for them, and adding one would be redundant rather than harmful.
  #
  # The public READ needs its own pattern: `/api/stickers/...` is under no existing
  # prefix. `…/api/stickers/*` and not `…/api/stickers` — every read URL carries an
  # `{id}` after the prefix, so there is no bare path to miss here, which is the opposite
  # of the `/api/friends` trap and worth stating so nobody "fixes" it later.
  #
  # Verify with a live request after deploying; the dry-run proves nothing about routing:
  #   405 -> the Worker was NEVER REACHED (static site answered) — pattern is wrong.
  #   404 -> Worker reached, no such sticker. THIS is the target for a bogus id.
  #   curl.exe -s -o NUL -w "%{http_code}" \
  #     https://flickto.app/api/stickers/0123456789abcdef0123456789abcdef
  { pattern = "flickto.app/api/stickers/*", zone_name = "flickto.app" }
]


# Zero-knowledge object storage for the social channel. The relay only ever
# stores ciphertext + opaque tokens/hashes.
# Create with: wrangler r2 bucket create flickto-social
#
# LIFECYCLE RULES — APPLIED 2026-07-27, not aspirational. Verify with
#   npx wrangler r2 bucket lifecycle list flickto-social
#
#   expire-share-links          share/  expire after 31 days
#   expire-rate-limit-counters  rl/     expire after 1 day
#
# Re-create with:
#   npx wrangler r2 bucket lifecycle add flickto-social "expire-share-links" "share/" --expire-days 31 -y
#   npx wrangler r2 bucket lifecycle add flickto-social "expire-rate-limit-counters" "rl/" --expire-days 1 -y
#
# **The share/ rule is load-bearing for the privacy policy**, which states that a
# share link's data is deleted after 30 days. Expiry in the Worker is enforced on
# READ ONLY (`isExpired` → 404); nothing in code deletes the object. Without this
# rule the link stops working while the data is kept forever, and the published
# policy becomes false. That was the live state until 2026-07-27.
#
# 31 days, not 30, so the object always outlives its logical expiry rather than
# racing it — there is never a window where it is physically gone before the app
# considers it expired.
#
# These live in Cloudflare, not in this file, so nothing here can enforce them.
# Treat a claim in a comment as a claim, not a fact: check the list before relying
# on one — that is exactly how the policy came to say something untrue.
# ── Group Watch (Durable Objects) ────────────────────────────────────────────
#
# The first Durable Object in this account. ⚠️ Requires the Workers PAID plan — DOs are not
# available on Free, which is the same reason `[limits] cpu_ms` could not be set on the
# scoring worker. See src/groupWatch.ts for why a socket is cheaper here than polling.
[[durable_objects.bindings]]
name = "GROUP_SESSION"
class_name = "GroupSession"

# ⚠️ `new_sqlite_classes`, not `new_classes`. SQLite-backed storage is the current backend
# for new namespaces; a namespace created on the legacy KV backend cannot be moved to it
# afterwards.
#
# ⚠️ A migration tag is applied ONCE and recorded server-side. Renaming or renumbering `v1`
# after a deploy makes wrangler try to create a namespace that already exists.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupSession"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flickto-social"

# One Take answers. READ ONLY, and only `game-state/answers/*` -- the plaintext answer
# daily-ai writes for the day, which this worker verifies submissions against. That prefix
# is not served: the Pages function routes `content/*` and nothing else, which is the whole
# reason the answer can sit in a public bucket and still be private.
[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "flickto-content"

# ── Anonymous submit rate limit (NOT YET ENABLED) ──
#
# `POST /api/daily-game/result` accepts a session-less submission, because the game is
# playable signed out and most web players never sign in. It is fully verified, so nobody
# can inflate a score without knowing the answer -- but nothing stops one client posting
# many VALID results to skew the public distribution.
#
# The handler already uses this binding when present and degrades to no limit when absent,
# so enabling it is a config change with no code change:
#
#   [[unsafe.bindings]]
#   name = "ANON_RATE_LIMITER"
#   type = "ratelimit"
#   namespace_id = "1001"
#   simple = { limit = 10, period = 60 }
#
# Left commented because it has not been exercised against this account. A WAF rate-limit
# rule on the route is the equivalent alternative and needs no binding at all.


# ⚠️ MEASURED 2026-08-15: the `unsafe.bindings` ratelimit approach above does NOT work
# on this account. Comment burst limiting was built on it first (COMMENT_USER_LIMITER /
# COMMENT_IP_LIMITER, limit 5/60s), `wrangler deploy` listed both bindings without
# error, and eight comment writes in 27 seconds were all accepted. Because the call is
# optional-chained, an absent binding is indistinguishable from a passing one -- it
# fails OPEN and silently. Every code path for this binding type in the pinned
# wrangler 3.114 is local-dev/miniflare only.
#
# Comment burst limits are now counted in D1 (see COMMENT_WRITES_PER_MINUTE below and
# migration 0041). Do not reintroduce a ratelimit binding here without first proving it
# returns a real 429 in production.


# Accounts, profiles, friendships, blocks (server-authoritative — NOT zero-knowledge).
# Get the id with: wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "flickto-accounts"
database_id = "5ddfdff4-c818-4131-98aa-41350f164ce0"
# The schema is no longer hand-applied. `migrations/0001_initial.sql` is the
# recorded baseline; add `NNNN_description.sql` for every change after it.
#   npx wrangler d1 migrations list  flickto-accounts --remote
#   npx wrangler d1 migrations apply flickto-accounts --remote
# WITHOUT --remote these hit the LOCAL dev database — the two are tracked
# separately, and forgetting the flag is the usual way production drifts.
# Nothing runs this on deploy, so `npm run deploy` does it first (package.json).
migrations_dir = "migrations"



# Inline comment translation (src/comments.ts, tier 2). Free allowance is 10,000
# Neurons/day on Free *and* Paid — roughly 320,000 tokens, so ~650–1,300 NEW
# translations a day once caching is counted. Beyond that the per-comment catch
# flags the comment and the client falls back to on-device ML Kit.
#
# Costs no extra Worker REQUESTS: inference inside an invocation is a subrequest.
# Subrequests are what bind — 50 per invocation on Free — which is why the comment
# page is capped at 20.
[ai]
binding = "AI"


# Derived watch-history stats (src/history.ts). KV, not D1, and not a counter table:
# the stats are a GROUP BY over `watch_history` and this is the cache in front of it,
# so the derivation runs at most once per user per 5 minutes instead of once per open
# of the History tab. Every write path that could change a total deletes the key.
#
# KV rather than `caches.default` because this response is PER USER and must survive
# a colo change — an edge cache keyed on URL would either be useless (the URL is the
# same for everyone) or actively wrong (one user's totals served to the next caller).
#
# Create with: npx wrangler kv namespace create HISTORY_STATS_KV
[[kv_namespaces]]
binding = "HISTORY_STATS_KV"
id = "1e44ca9d6cc5483ab2b3915e6b4005b6"


# One data point per watch event, written with ctx.waitUntil so it never delays the
# sync response. This is the ONLY source for platform-wide numbers: `watch_history`
# is per-account and a "how much has everyone watched" query over it would be an
# unbounded full scan of the hottest table in the database.
#
# `dataset` is the name that appears in the SQL API's FROM clause; `binding` is the
# name in the Worker. They are deliberately different so a rename of one cannot
# silently retarget the other.
[[analytics_engine_datasets]]
binding = "HISTORY_ANALYTICS"
dataset = "history_events"


[vars]
# Group Watch sessions one IP may create per hour. Enforced by the R2 hourly-bucket helper
# in index.ts — NOT the native `unsafe.bindings` ratelimit, which was measured on
# 2026-08-15 to deploy cleanly and never actually limit, failing open and silently.
GROUP_WATCH_PER_HOUR = "20"

# Cloudflare account id, for the Analytics Engine SQL API (src/history.ts). Reading a
# dataset is an ACCOUNT-level HTTP call, not a binding — the `HISTORY_ANALYTICS`
# binding only writes. The matching credential is a SECRET:
#   wrangler secret put ANALYTICS_API_TOKEN
# (a Cloudflare API token with Account Analytics: Read). With either missing,
# `GET /api/stats/global` answers 503 not_configured; writes are unaffected, so the
# data still accumulates while the token is outstanding.
CF_ACCOUNT_ID = "5c474f4f8c165daca8b28eb4a824e512"
SHARE_TTL_SECONDS = "2592000"
MAX_ITEMS = "100"
# Orphan-profile reaper: 365-day inactivity TTL, bounded per run. Triggered
# opportunistically from request traffic (no cron — account is at its 5-cron
# limit), at most once per REAP_INTERVAL_SECONDS.
PROFILE_TTL_SECONDS = "31536000"
GC_MAX_PREFIXES_PER_RUN = "500"
REAP_INTERVAL_SECONDS = "86400"
# Retention for `_reports/` moderation records (365d). NOTHING else prunes that
# prefix — the orphan reaper only walks friendId-shaped folders, and the admin only
# deletes on an explicit dismiss — so it grew forever until the same opportunistic
# run started pruning it. An R2 lifecycle rule on `_reports/` would do the same job
# with no code; this exists because a rule nobody has clicked is not a fix.
REPORT_TTL_SECONDS = "31536000"
# Per-IP hourly cap for share-create; inbox-post allows 6x this.
RATE_LIMIT_PER_HOUR = "10"
# Per-author hourly cap on NEW comments (edits are free — charging for a typo fix
# would cost the same as a new comment).
#
# ⚠️ This used to be the belt, with "one comment per user per subject" as the real
# anti-spam control. Migration 0043 lifted that restriction, so these two caps ARE
# the control now. COMMENTS_PER_HOUR is product-wide; the per-subject cap is what
# stops one author absorbing the whole of it in a single title's sheet.
COMMENTS_PER_HOUR = "30"
COMMENTS_PER_SUBJECT_PER_HOUR = "5"
# Our own source slug in the commsuni.tv catalogue.
#
# NOT a secret — it appears in every comment's `origin.slug`, so it is public by
# construction. It lives here rather than beside COMMSUNI_KEY for exactly that reason.
#
# ⚠️ This is the primary dedup control. Phase 1 reads the source catalogue and passes
# every active slug EXCEPT this one, so that our own mirrored comments are filtered
# server-side rather than fetched and discarded. A wrong value here does not fail — it
# silently reads our own comments back and renders them twice.
COMMSUNI_SLUG = "flickto"
# ── The write mirror's kill switch ───────────────────────────────────────────────
#
# ⚠️ **"1" publishes our users' public comments to commsuni.tv, where every other
# partner app reads them.** Anything else — including absence, "0", "true" and "yes" —
# leaves the mirror off. It fails CLOSED on purpose: a typo must not start publishing.
#
# ⚠️ **Do not set this to "1" until the privacy-policy update is PUBLISHED**, not merely
# written. Mirroring sends user content to a third party; doing that before the policy
# discloses it is a compliance failure, not a sequencing preference. It also needs the
# `archive:write` scope on COMMSUNI_KEY and the media hosts allowlisted.
#
# Turning it back off stops publishing but NOT retraction: deletes and reports keep
# draining, because rows published while it was on must stay retractable afterwards.
COMMSUNI_MIRROR = "1"

# Rate-limit strikes within one hour that trigger an automatic posting suspension,
# and how long that suspension lasts (default 24h). A limiter only refuses the
# current request; a script retries at one request per window forever, so without
# these it is never actually stopped. "0" disables the auto-suspend entirely.
STRIKES_TO_SUSPEND = "10"
AUTO_SUSPEND_MS = "86400000"
# Per-minute burst caps on comment writes (POST and DELETE), counted in D1 over a
# 60s window. The hourly cap above is spent only by a NEW comment, so without these an
# edit loop on one subject is free; the IP cap is what makes N accounts driven by one
# script cost N times as much. "0" disables either.
COMMENT_WRITES_PER_MINUTE = "5"
COMMENT_WRITES_PER_MINUTE_IP = "20"
# ── App Check (Play Integrity) on comment writes ──
# "off" | "log" | "enforce".
#   log     — verify and record the outcome, NEVER reject. This is how adoption gets
#             measured before enforcement can lock anyone out.
#   enforce — reject a write with no valid token, EXCEPT from a client identifying
#             itself below APPCHECK_MIN_VERSION (a build that shipped before the app
#             sent the header can never pass, so it is exempt rather than broken).
# ⚠️ Do NOT flip to "enforce" until (a) the logs show real traffic passing and (b) the
# App Check *debug* provider is registered — Play Integrity fails for any build not
# installed from Play, so debug builds break first and silently.
APPCHECK_MODE = "log"
# versionCode 45 is the first build that attaches X-Firebase-AppCheck to comment
# writes. Anything below it — including the PWA and any client sending no version
# header at all, which reads as 0 — is exempt even under "enforce". Raising this is
# how enforcement is tightened later; it must never be lowered to 0, which would
# subject every old install to a check it cannot pass.
APPCHECK_MIN_VERSION = "45"
# Firebase project **NUMBER**, not the id. App Check's `iss`/`aud` carry the number;
# FIREBASE_PROJECT_ID below carries the id, which is what an ID token's `aud` uses.
# Swapping them fails every verification with a claim mismatch that reads like a
# signing bug — this has cost time before.
FIREBASE_PROJECT_NUMBER = "468641021144"
# Image moderation. Set to "true" and add the VISION_API_KEY secret to enable the
# paid Cloud Vision SafeSearch scan (wrangler secret put VISION_API_KEY).
MODERATION_ENABLED = "true"
# Distinct reporters that auto-hide a picture pending admin review.
REPORT_AUTOHIDE = "3"
# Google account linking (Part 1). The OAuth **Web** client id(s) an ID token's `aud`
# may equal — comma-separated, all accepted. ACCOUNT_PEPPER is a SECRET (not here):
# `wrangler secret put ACCOUNT_PEPPER`. Until both are set, the account endpoints
# return 503 not_configured and the rest of the Worker is unaffected.
#
# TWO ids during the OAuth client migration, and BOTH are accepted:
#   326222246100-…  the original project — what older builds send.
#   468641021144-…  the Firebase project (flickto-cf7b6) — what new builds send.
# Order is irrelevant.
#
# ⚠️ This comment used to say the first was needed because "every app already on the
# Play Store sends this; dropping it breaks linking for real users". That claim was
# never substantiated and the bucket contradicts it — see the R2 note further down:
# 97 identity folders, SIX with a published profile, 71 two-object shells, and 44
# that never ran a build after the push-topics cutover. Reconciled 2026-07-31 rather
# than left standing, because "real users would break" is exactly the kind of
# unverified claim that stops a cleanup for no reason.
#
# Keep both until the version floor (MIN_SOCIAL_VERSION) has been raised and old
# builds are provably gone — that is the evidence this needs, not the comment.
GOOGLE_WEB_CLIENT_ID = "326222246100-snpqapsggs1k6j9bnq2ecp37nlpfhe26.apps.googleusercontent.com,468641021144-3s841cgmadpis3qct264k7udicmbrp3r.apps.googleusercontent.com"
# Firebase Auth (Phase 1). The project **id** — a Firebase ID token's `aud` is the
# project id, NOT the project number (468641021144). Unset → /api/auth/* 503s.
FIREBASE_PROJECT_ID = "flickto-cf7b6"
# Lowest Android versionCode allowed on the social surface. Returned on
# /api/me/bootstrap; the client blocks Friends below it, and the Worker enforces it
# too (a client-side gate is a request, not a guarantee).
#
# **0 = no gate**, and that is the correct default — a typo here locks every user out
# of social, so unset/invalid deliberately falls back to 0 rather than to a floor.
#
# Raise this ONLY to retire the E2EE relay profile path, and only once the gating
# build has actually shipped and had time to roll out. Record the value and the date
# raised in docs/Current Plans/android-accounts-firebase-d1-plan.md §6C — an
# unrecorded flip cannot be audited later, and getting it wrong silently breaks
# friends' activity for everyone still behind.
#
# STILL 0 — and deliberately, having measured what raising it would actually do.
#
# **A floor of 31 would have blocked nobody.** versionCode 31 was set 2026-07-28; the
# gate itself shipped 2026-07-29, still under 31. So builds exist that report 31 and
# contain no gate code, and `31 < 31` is false. Raising it to 31 looks like protection
# and provides none, which is worse than leaving it off.
#
# **A client-side "update required" prompt can never reach a build that predates the
# prompt.** The gate is forward-looking insurance for FUTURE flips, not a way to warn
# whoever is behind today. Those clients swallow the 426 in a runCatching and simply go
# stale — which is exactly the silent breakage the plan warns of.
#
# RAISE IT TO 32 once a versionCode-32 build has shipped and rolled out. 32 is the first
# build that both contains the gate and is distinguishable from the pre-gate 31s. Record
# the value and date here and in docs/Current Plans/android-accounts-firebase-d1-plan.md
# §6C when you do — an unrecorded flip cannot be audited later.
#
# Measured 2026-07-29, for whoever weighs that decision: `flickto-social` is the only
# social bucket (created 2026-06-03) at 330 objects / 1.25 MB across 97 folders — but
# only **6** have ever published a profile.json, and 71 are 2-object shells that
# registered an identity and published nothing. 44 never ran a build after the
# push-topics cutover of ~21 Jul, so they are dead. The blast radius of stopping relay
# writes is those 6 folders. Note this CONTRADICTS the GOOGLE_WEB_CLIENT_ID comment
# above about apps "already on the Play Store" with "real users" — that claim is either
# about a build predating the social channel, or stale.
MIN_SOCIAL_VERSION = "0"


[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# ── The archive outbox drain ────────────────────────────────────────────────────
#
# ⚠️ Added after discovering the "this account is at its 5-cron limit" comment in
# index.ts was WRONG: 4 were in use (cloudflare-backend 1, cloudflare-proxy 2,
# daily-ai 1), leaving one free. The opportunistic drain was built around a limit
# that did not exist, and it does not work on its own — the natural flow is
# post-then-look, and the client renders the new comment from Room without a read,
# so nothing triggers it. Comments sat queued and due, twice.
#
# Every 5 minutes: publishing a comment is not urgent, and retracting one is bounded
# by this too, against a policy that promises deletion propagates "within minutes".
#
# ⚠️ MUST stay at the end of the file. TOML sections run until the next header, so
# putting this mid-file swallowed every `[vars]` entry below it into the triggers
# table — including APPCHECK_MODE and MIN_SOCIAL_VERSION. `wrangler deploy --dry-run`
# caught it ("Unexpected fields found in triggers field"); nothing else would have.
[triggers]
crons = ["*/5 * * * *"]
